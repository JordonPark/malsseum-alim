<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff">
<meta name="application-name" content="오늘의 교회">
<meta name="apple-mobile-web-app-title" content="오늘의 교회">
<meta name="description" content="우리 교회 말씀·주보·예배">
<title>오늘의 교회</title>
<link rel="icon" href="./web/icon.png">
<link rel="apple-touch-icon" href="./web/icon.png">
<link rel="stylesheet" href="./web/style.css?v=12">
<script defer src="./web/app.js?v=5"></script>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#home">
      <img class="brand-icon" src="./web/icon.png" width="34" height="34" alt="">
      <img class="church-logo" width="44" height="34" alt="" hidden>
      <span class="denomination-badge" aria-hidden="true" hidden></span>
      <span class="brand-name">오늘의 교회</span>
    </a>
    <div class="header-actions">
      <a class="login-link" href="#login" hidden>로그인하기</a>
      <a class="settings-link" href="#settings" aria-label="설정"><span class="icon" data-icon="settings" aria-hidden="true"></span></a>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<nav class="tabs" aria-label="주 메뉴" hidden>
  <div class="tabs-inner">
    <a href="#home"><span class="tab-icon"><span class="icon" data-icon="home" aria-hidden="true"></span></span>홈</a>
    <a href="#bulletin"><span class="tab-icon"><span class="icon" data-icon="bulletin" aria-hidden="true"></span></span>주보</a>
    <a href="#worship"><span class="tab-icon"><span class="icon" data-icon="worship" aria-hidden="true"></span></span>예배</a>
    <a href="#devotion"><span class="tab-icon"><span class="icon" data-icon="word" aria-hidden="true"></span></span>말씀</a>
  </div>
</nav>
<template id="entry">
  <div class="welcome">
    <section class="entry-card" aria-labelledby="entry-heading">
      <img class="chapel-art" src="./web/chapel.webp" alt="" fetchpriority="high">
      <h1 id="entry-heading">우리 교회 찾기</h1>
      <p class="entry-description">예배 일정과 이번 주 말씀을 확인하세요.</p>
      <form id="church-form" novalidate>
        <label for="church-code">교회 코드 6자리</label>
        <input id="church-code" name="code" type="text" inputmode="numeric" autocomplete="off" aria-describedby="church-hint church-error">
        <p id="church-hint" class="entry-hint">주보나 교회 카톡방에서 받은 코드를 입력하세요.</p>
        <p id="church-error" class="entry-error" role="alert" hidden></p>
        <button class="button primary entry-button" type="submit">교회 찾기</button>
      </form>
      <a class="sample-link" href="#home">예시 교회 둘러보기</a>
    </section>
  </div>
</template>
<template id="login">
  <div class="welcome">
    <section class="entry-card login-card" aria-labelledby="login-heading">
      <h1 id="login-heading">관리자 로그인</h1>
      <p class="entry-description">카카오·Google 계정 연결을 준비 중이에요.</p>
      <a class="button secondary entry-button" href="#entry">교회 찾기로 돌아가기</a>
    </section>
  </div>
</template>
<template id="home">
  <div class="page-heading church-heading">
    <div>
      <h1>늘봄교회</h1>
      <p class="church-denomination" hidden></p>
    </div>
    <p class="church-example">예시 교회</p>
  </div>
  <section class="featured" aria-labelledby="weekly-word">
    <div class="featured-art" aria-hidden="true">
      <img src="./web/church-morning.webp" alt="" width="960" height="640">
      <img class="featured-grass featured-grass-near" src="./web/church-morning.webp" alt="">
      <img class="featured-grass featured-grass-far" src="./web/church-morning.webp" alt="">
      <span class="featured-sun">
        <span class="featured-sun-spark"></span>
        <span class="featured-sun-spark"></span>
      </span>
    </div>
    <div class="featured-content">
      <p class="feature-label">이번 주 말씀</p>
      <h2 id="weekly-word">평안한 하루</h2>
      <p class="feature-reference">요한복음 14장 27절</p>
      <a class="feature-link" href="#devotion">말씀 읽기</a>
    </div>
  </section>
  <nav class="menu-list home-menu" aria-label="교회 바로가기">
    <a class="menu-row" href="#bulletin">
      <span class="menu-icon blue"><span class="icon" data-icon="bulletin" aria-hidden="true"></span></span>
      <span class="menu-text"><strong>이번 주 주보</strong><small>예배 순서와 교회 소식</small></span>
      <span class="chevron" aria-hidden="true"></span>
    </a>
    <a class="menu-row" href="#worship">
      <span class="menu-icon green"><span class="icon" data-icon="worship" aria-hidden="true"></span></span>
      <span class="menu-text"><strong>예배 안내</strong><small>주일예배 · 오전 11시</small></span>
      <span class="chevron" aria-hidden="true"></span>
    </a>
    <a class="menu-row" href="#bulletin/news">
      <span class="menu-icon gold"><span class="icon" data-icon="news" aria-hidden="true"></span></span>
      <span class="menu-text"><strong>교회 소식</strong><small>새가족 환영 모임</small></span>
      <span class="chevron" aria-hidden="true"></span>
    </a>
  </nav>
</template>
<template id="bulletin">
  <header class="page-heading church-detail-heading">
    <h1>이번 주 주보</h1>
    <div class="church-detail-meta">
      <p>늘봄교회</p>
      <span class="sample-label">예시 주보</span>
    </div>
  </header>
  <article class="bulletin" aria-label="늘봄교회 주보">
    <section class="service-card" aria-labelledby="bulletin-service-title">
      <div>
        <h2 id="bulletin-service-title"><span class="icon" data-icon="worship" aria-hidden="true"></span>주일예배</h2>
        <time class="service-time" datetime="11:00">오전 11시</time>
        <p class="service-details">
          <time datetime="2026-11-22">11월 22일 일요일</time>
          <span class="service-place">본당</span>
        </p>
      </div>
      <img class="service-illustration" src="./web/chapel.webp" alt="" width="460" height="306">
    </section>

    <details class="bulletin-card bulletin-order">
      <summary>
        <span class="menu-icon blue"><span class="icon" data-icon="bulletin" aria-hidden="true"></span></span>
        예배 순서
        <span class="chevron" aria-hidden="true"></span>
      </summary>
      <ol>
        <li>찬송</li>
        <li>대표기도</li>
        <li>성경 봉독</li>
        <li>설교</li>
        <li>축도</li>
      </ol>
    </details>

    <section class="bulletin-card bulletin-sermon" aria-labelledby="bulletin-sermon-title">
      <h2 id="bulletin-sermon-title">
        <span class="menu-icon gold"><span class="icon" data-icon="word" aria-hidden="true"></span></span>
        설교 말씀
      </h2>
      <h3>평안한 하루</h3>
      <p>요한복음 14장 27절</p>
      <a class="button primary" href="#devotion">말씀 읽기</a>
    </section>

    <section class="bulletin-card bulletin-news" id="bulletin-news" tabindex="-1" aria-labelledby="bulletin-news-title">
      <h2 id="bulletin-news-title">
        <span class="menu-icon green"><span class="icon" data-icon="news" aria-hidden="true"></span></span>
        교회 소식
      </h2>
      <h3>새가족 환영 모임</h3>
      <p>예배 후 본당에서 모입니다.</p>
    </section>
  </article>
</template>
<template id="worship">
  <header class="page-heading church-detail-heading">
    <h1>예배 안내</h1>
    <div class="church-detail-meta">
      <p>늘봄교회</p>
      <span class="sample-label">예시 일정</span>
    </div>
  </header>
  <div class="worship-schedule">
    <section class="service-card" aria-labelledby="worship-sunday">
      <div>
        <h2 id="worship-sunday"><span class="icon" data-icon="worship" aria-hidden="true"></span>주일예배</h2>
        <time class="service-time" datetime="11:00">오전 11시</time>
        <p class="service-details"><span>매주 일요일</span><span class="service-place">본당</span></p>
      </div>
      <img class="service-illustration" src="./web/chapel.webp" alt="" width="460" height="306">
    </section>

    <section class="service-card worship-midweek" aria-labelledby="worship-wednesday">
      <div>
        <h2 id="worship-wednesday"><span class="icon" data-icon="worship" aria-hidden="true"></span>수요예배</h2>
        <time class="service-time" datetime="19:30">오후 7시 30분</time>
        <p class="service-details"><span>매주 수요일</span><span class="service-place">본당</span></p>
      </div>
      <span class="worship-moon" aria-hidden="true"></span>
    </section>

    <a class="menu-row page-shortcut" href="#bulletin">
      <span class="menu-icon gold"><span class="icon" data-icon="bulletin" aria-hidden="true"></span></span>
      <span class="menu-text"><strong>이번 주 주보 보기</strong><small>예배 순서와 설교 말씀</small></span>
      <span class="chevron" aria-hidden="true"></span>
    </a>
  </div>
</template>
<template id="devotion">
  <header class="page-heading church-detail-heading">
    <h1>이번 주 말씀</h1>
    <div class="church-detail-meta">
      <p>늘봄교회</p>
      <span class="sample-label">예시 말씀</span>
    </div>
  </header>
  <article class="devotion" aria-labelledby="devotion-title">
    <div class="devotion-cover">
      <div class="devotion-intro">
        <div>
          <h2 id="devotion-title">평안한 하루</h2>
          <a class="devotion-reference" href="#read/14/27">
            <span class="icon" data-icon="word" aria-hidden="true"></span>
            <span>요한복음 14장 27절</span>
          </a>
        </div>
        <div class="devotion-art" aria-hidden="true">
          <img class="devotion-book" src="./web/devotion-book.webp" alt="" width="480" height="320">
          <span class="devotion-sheet"></span>
        </div>
      </div>
      <button class="button primary devotion-listen" type="button" data-listen>묵상 듣기</button>
    </div>
    <section class="devotion-card">
      <h3>묵상</h3>
      <p data-spoken>오늘은 잠시 멈추고 마음을 돌봅니다. 서두르지 않고 지금 할 수 있는 작은 일부터 시작해 봅니다.</p>
    </section>
    <section class="devotion-card devotion-apply">
      <h3>적용</h3>
      <p data-spoken>오늘 만나는 한 사람에게 따뜻한 인사를 건네 봅니다.</p>
    </section>
    <section class="devotion-card devotion-prayer">
      <h3>기도</h3>
      <p data-spoken>오늘도 평안한 마음을 주세요. 주변 사람들에게 그 평안을 나누게 해 주세요.</p>
    </section>
    <a class="menu-row page-shortcut" href="#search">
      <span class="menu-icon blue"><span class="icon" data-icon="search" aria-hidden="true"></span></span>
      <span class="menu-text"><strong>성경 찾기</strong></span>
      <span class="chevron" aria-hidden="true"></span>
    </a>
  </article>
</template>
<template id="search">
  <a class="back" href="#devotion">말씀으로</a>
  <div class="page-heading"><h1>성경 찾기</h1><p id="range">예시 범위 · 요한복음 13–15장</p></div>
  <article class="paper"><label for="query">책 이름 또는 구절</label><input id="query" type="search" placeholder="예: 요 14:27" aria-describedby="range"><div id="results" class="results" aria-live="polite"></div></article>
</template>
<template id="read">
  <a class="back" id="reader-back" href="#search">성경 찾기로</a>
  <div class="page-heading"><h1 id="chapter-name"></h1><p>예시 본문</p></div>
  <article class="paper"><ol id="verses"></ol><nav class="row" aria-label="장 이동"><a class="button secondary" id="previous">이전 장</a><a class="button secondary" id="next">다음 장</a></nav></article>
</template>
<template id="settings">
  <div class="page-heading"><h1>설정</h1></div>
  <div class="menu-list">
    <button id="size" class="menu-row size" type="button" aria-pressed="false">
      <span class="menu-icon blue font-icon" aria-hidden="true">가</span>
      <span class="menu-text"><strong>큰 글씨</strong></span>
      <span class="toggle" aria-hidden="true"></span>
    </button>
    <a href="#entry" class="menu-row">
      <span class="menu-icon green"><span class="icon" data-icon="swap" aria-hidden="true"></span></span>
      <span class="menu-text"><strong>교회 변경</strong><small>교회 코드로 다시 찾기</small></span>
      <span class="chevron" aria-hidden="true"></span>
    </a>
    <a href="#login/home" class="menu-row" data-admin-login>
      <span class="menu-icon gold"><span class="icon" data-icon="settings" aria-hidden="true"></span></span>
      <span class="menu-text"><strong>관리자 로그인</strong></span>
      <span class="chevron" aria-hidden="true"></span>
    </a>
  </div>
</template>
<div id="status" role="status" class="status"></div>
</body>
</html>
